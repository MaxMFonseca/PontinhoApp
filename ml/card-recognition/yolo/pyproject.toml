[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pontinho-yolo"
version = "0.1.0"
description = "Reproducible single-stage YOLO toolchain for Pontinho"
requires-python = ">=3.11,<3.12"
dependencies = [
  "flatbuffers==24.3.25",
  "numpy==1.26.4",
  "Pillow==11.0.0",
  "PyYAML==6.0.2",
  "tflite==2.18.0",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "ultralytics==8.4.177",
]

[dependency-groups]
dev = [
  "pytest==8.3.5",
  "ruff==0.8.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]
